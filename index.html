<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crew Schedule & Operations Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    window.addEventListener('error', function(e) { e.preventDefault(); return true; });
    window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); });

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              goldHover: '#d97706',
              dark: '#0a0f1d',
              panel: '#111827',
              surface: '#182235',
              card: '#1f293d',
              border: '#2e3d55'
            }
          }
        }
      }
    };
  </script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .drag-over-cell { background-color: rgba(245, 158, 11, 0.15) !important; outline: 2px dashed #f59e0b !important; }

    /* TV Wall Mode Responsive Compaction */
    body.wall-mode header { height: 3rem !important; padding-left: 0.75rem; padding-right: 0.75rem; }
    body.wall-mode aside { width: 16rem !important; }
    body.wall-mode .crew-card { padding: 0.35rem 0.5rem !important; margin-bottom: 0.25rem !important; }
    body.wall-mode .crew-card h4 { font-size: 0.75rem !important; line-height: 1rem !important; }
    body.wall-mode .crew-card p { font-size: 0.65rem !important; }
    body.wall-mode .crew-card-meta { display: none !important; }
    body.wall-mode .cal-cell { min-height: 0 !important; }
  </style>
</head>
<body class="bg-[#0a0f1d] text-slate-100 min-h-screen flex flex-col select-none antialiased overflow-x-hidden">

  <!-- Touch Ghost for Mobile Dragging -->
  <div id="touchGhost" class="fixed pointer-events-none z-50 px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold shadow-2xl flex items-center gap-2 border border-amber-300 opacity-0 transition-opacity transform -translate-x-1/2 -translate-y-1/2 text-xs">
    <span id="ghostTitle">Move Item</span>
  </div>

  <!-- Header Bar -->
  <header class="bg-slate-900 border-b border-brand-border px-3 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 shadow-lg">
    <!-- Brand Crest & Sync Badge -->
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-md shadow-amber-500/20 text-slate-950 shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3a9 9 0 0 0-9 9v1a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1a9 9 0 0 0-9-9zm-1 3.1c.33-.06.66-.1 1-.1s.67.04 1 .1V13h-2V6.1zM5 13v-1a7 7 0 0 1 4-6.32V13H5zm14 0h-4V6.68A7 7 0 0 1 19 12v1zM2 17h20v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-2">Crew Schedule</h1>
        <p class="text-[9px] sm:text-[10px] text-slate-400 font-medium leading-none">Fishers, IN Operations Hub</p>
      </div>

      <!-- Cloud Status Badge -->
      <div id="cloudStatusBadge" class="flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="cloudStatusText">Live Sync</span>
      </div>
    </div>

    <!-- Center Navigation Controls -->
    <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-brand-border order-3 md:order-2 w-full md:w-auto justify-between md:justify-start">
      <div class="flex items-center gap-1">
        <button onclick="navigatePeriod(-1)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button onclick="goToToday()" class="px-2.5 py-1 text-[11px] font-bold uppercase rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">Today</button>
        <span id="currentPeriodLabel" class="px-2 text-xs sm:text-sm font-bold text-white min-w-[110px] sm:min-w-[130px] text-center">October 2026</span>
        <button onclick="navigatePeriod(1)" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="flex items-center gap-1 pl-1 border-l border-slate-800">
        <button onclick="setView('month')" id="btnViewMonth" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950">Month</button>
        <button onclick="setView('week')" id="btnViewWeek" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800">Week</button>
      </div>
    </div>

    <!-- Weather & TV Wall Actions -->
    <div class="flex items-center gap-2 order-2 md:order-3 ml-auto md:ml-0">
      <!-- Sky Radar Preview Pill -->
      <div onclick="openRadarModal()" class="relative h-8 sm:h-9 px-2 sm:px-3 rounded-xl overflow-hidden border border-brand-border cursor-pointer group bg-slate-950 flex items-center gap-2 shadow-inner" title="Click for 5-Day Forecast & Live Doppler Radar">
        <canvas id="weatherSkyCanvas" class="absolute inset-0 w-full h-full opacity-40"></canvas>
        <div class="relative z-10 flex items-center gap-2">
          <span id="headerTemp" class="text-xs sm:text-sm font-black text-white">68°F</span>
          <span id="headerCondition" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-900/90 text-amber-300 border border-amber-400/30 truncate max-w-[65px] sm:max-w-none">Partly Cloudy</span>
        </div>
      </div>

      <!-- TV Wall Toggle -->
      <button onclick="toggleWallFullscreen()" id="btnWallToggle" class="px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl bg-slate-950 hover:bg-slate-800 border border-brand-border text-xs font-bold text-slate-300 hover:text-white transition flex items-center gap-1.5 shadow" title="Toggle Compact Wall Fit">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        <span class="hidden sm:inline">TV Wall</span>
      </button>
    </div>
  </header>

  <!-- 5-Day Weather Strip -->
  <div id="forecastStrip" class="bg-slate-950/90 border-b border-brand-border px-3 py-1.5 flex items-center gap-2 overflow-x-auto custom-scrollbar shrink-0">
    <div class="text-[9px] font-bold uppercase tracking-wider text-amber-400 shrink-0 pr-2 border-r border-slate-800 flex items-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
      <span>Fishers 5-Day</span>
    </div>
    <div id="forecastDaysContainer" class="flex items-center gap-3 text-xs shrink-0">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Workspace: Flexible Responsive Layout -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">

    <!-- Left Sidebar: Crews & Sold Backlog (Collapsible/Togglable on Mobile) -->
    <aside id="mainSidebar" class="w-full md:w-72 lg:w-80 bg-slate-900 border-b md:border-b-0 md:border-r border-brand-border flex flex-col shrink-0 max-h-48 md:max-h-none overflow-hidden transition-all duration-200">
      
      <!-- Tab Header -->
      <div class="p-2 border-b border-brand-border bg-slate-950/60 flex gap-1 shrink-0">
        <button onclick="setSidebarTab('crews')" id="tabBtnCrews" class="flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition">Active Crews (5)</button>
        <button onclick="setSidebarTab('unscheduled')" id="tabBtnUnscheduled" class="flex-1 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 transition">Sold Backlog</button>
      </div>

      <!-- Panel 1: Active Crews List -->
      <div id="panelCrews" class="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar">
        <div id="crewsListContainer" class="space-y-1.5"></div>
      </div>

      <!-- Panel 2: Sold Jobs Backlog -->
      <div id="panelUnscheduled" class="hidden flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar">
        <div class="flex items-center justify-between px-1 mb-1">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Intake Backlog</span>
          <button onclick="openAddSoldJobModal()" class="px-2 py-0.5 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 text-[10px] font-bold shadow">+ Add</button>
        </div>
        <div id="unscheduledListContainer" class="space-y-1.5"></div>
      </div>
    </aside>

    <!-- Calendar View Area -->
    <main class="flex-1 flex flex-col bg-[#0a0f1d] overflow-hidden">
      <!-- Weekday Header Row -->
      <div class="grid grid-cols-7 border-b border-brand-border bg-slate-900/90 text-center py-1.5 text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 shrink-0">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <!-- Calendar Days Grid -->
      <div id="calendarGrid" class="flex-1 grid grid-cols-7 grid-rows-5 gap-px bg-slate-800/80 overflow-y-auto custom-scrollbar"></div>
    </main>
  </div>

  <!-- Radar & Atmospheric Modal -->
  <div id="modalRadar" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-4 hidden">
    <div class="bg-slate-900 border border-brand-border rounded-2xl w-full max-w-3xl p-4 sm:p-6 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-brand-border pb-2">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
          <h3 class="text-sm sm:text-base font-bold text-white">Hamilton County Doppler Radar • Fishers Hub</h3>
        </div>
        <button onclick="closeModal('modalRadar')" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>
      
      <div class="relative w-full h-[280px] sm:h-[360px] bg-slate-950 rounded-xl overflow-hidden border border-brand-border flex items-center justify-center">
        <canvas id="dopplerRadarCanvas" class="w-full h-full"></canvas>
      </div>

      <div class="flex justify-between items-center text-xs text-slate-400 pt-1">
        <span>NOAA Doppler Radar Feed</span>
        <button onclick="closeModal('modalRadar')" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs">Close</button>
      </div>
    </div>
  </div>

  <!-- Job Edit / Create Modal -->
  <div id="modalJobDetails" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-brand-border rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-brand-border pb-2">
        <h3 id="modalJobTitle" class="text-sm font-bold text-white">Schedule Job Assignment</h3>
        <button onclick="closeModal('modalJobDetails')" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>
      <input type="hidden" id="jobModalId">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Assign Crew</label>
          <select id="jobModalCrewSelect" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400"></select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Date</label>
          <input type="date" id="jobModalDateInput" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Client Name / Project Title</label>
        <input type="text" id="jobModalTitleInput" placeholder="e.g. Miller - Louvered Pergola" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Job Site Address</label>
        <div class="flex gap-1.5">
          <input type="text" id="jobModalAddressInput" placeholder="Fishers, IN" class="flex-1 bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
          <button type="button" onclick="openCurrentModalAddressInGoogleMaps()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 border border-brand-border">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          </button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Scope</label>
          <select id="jobModalScopeSelect" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
            <option value="Deck">Composite Deck</option>
            <option value="Pergola">Louvered Pergola</option>
            <option value="Pavilion">Timber Pavilion</option>
            <option value="Porch">Screened Porch</option>
            <option value="Pickup / Delivery">Material Delivery</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Status</label>
          <select id="jobModalStatusSelect" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
            <option value="Scheduled">Scheduled</option>
            <option value="In Progress">In Progress</option>
            <option value="Material Staged">Material Staged</option>
            <option value="Inspection Pending">Inspection Pending</option>
          </select>
        </div>
      </div>
      <div class="flex justify-between items-center pt-2 border-t border-brand-border">
        <button type="button" id="btnDeleteJob" onclick="deleteCurrentJob()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-500/20 text-rose-300 hover:bg-rose-500 hover:text-white transition">Delete</button>
        <div class="flex gap-2">
          <button type="button" onclick="closeModal('modalJobDetails')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700">Cancel</button>
          <button type="button" onclick="saveJobAssignment()" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Sold Job Modal -->
  <div id="modalAddSoldJob" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-brand-border rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-3">
      <div class="flex items-center justify-between border-b border-brand-border pb-2">
        <h3 class="text-sm font-bold text-white">Add Sold Project</h3>
        <button onclick="closeModal('modalAddSoldJob')" class="text-slate-400 hover:text-white text-base">✕</button>
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Client Name</label>
        <input type="text" id="soldClientName" placeholder="Client Name" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Scope</label>
        <input type="text" id="soldScope" placeholder="e.g. 20x16 Timber Pavilion" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Site Address</label>
        <input type="text" id="soldAddress" placeholder="Fishers, IN" class="w-full bg-slate-950 border border-brand-border rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-400">
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-brand-border">
        <button type="button" onclick="closeModal('modalAddSoldJob')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">Cancel</button>
        <button type="button" onclick="saveSoldJobToBacklog()" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950">Add</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION LOGIC & REAL-TIME SYNC -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJM-9LdpG9LWY1gWp8XIW_ox5jOw6GcDM",
      projectId: "crew-schedule-b6b5c",
      databaseURL: "https://crew-schedule-b6b5c-default-rtdb.firebaseio.com"
    };

    let db = null;
    let scheduleRef = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      scheduleRef = db.ref('office_schedule_data');
      
      scheduleRef.on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) {
          if (cloudData.crews) crews = cloudData.crews;
          if (cloudData.events) events = cloudData.events;
          if (cloudData.unscheduledJobs) unscheduledJobs = cloudData.unscheduledJobs;
          renderCrewsSidebar();
          renderUnscheduledQueue();
          renderCalendar();
          updateCloudStatus(true);
        }
      }, () => updateCloudStatus(false));
    } catch(err) {
      updateCloudStatus(false);
    }

    function updateCloudStatus(connected) {
      const badge = document.getElementById('cloudStatusBadge');
      const text = document.getElementById('cloudStatusText');
      if (connected) {
        badge.className = "flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
        text.innerText = "Live Sync";
      } else {
        badge.className = "flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30";
        text.innerText = "Local Cache";
      }
    }

    function pushDataToCloud() {
      localStorage.setItem('crew_schedule_crews_v3', JSON.stringify(crews));
      localStorage.setItem('crew_schedule_events_v3', JSON.stringify(events));
      localStorage.setItem('crew_schedule_unscheduled_v3', JSON.stringify(unscheduledJobs));

      if (scheduleRef) {
        scheduleRef.set({
          crews: crews,
          events: events,
          unscheduledJobs: unscheduledJobs,
          lastUpdated: Date.now()
        }).catch(() => {});
      }
    }

    let currentDate = new Date();
    let currentView = 'month';

    let crews = JSON.parse(localStorage.getItem('crew_schedule_crews_v3')) || [
      { id: 'crew-1', name: 'Joe', trade: 'Decks & Railing', size: 4, color: '#a855f7' },
      { id: 'crew-2', name: 'Joseph', trade: 'Timber Pavilions & Framing', size: 5, color: '#10b981' },
      { id: 'crew-3', name: 'Sam', trade: 'Louvered Pergolas', size: 3, color: '#f43f5e' },
      { id: 'crew-4', name: 'Willy', trade: 'Finish Carpentry & Trim', size: 5, color: '#3b82f6' },
      { id: 'crew-5', name: '84 / Pickup', trade: 'Logistics & Material Drops', size: 2, color: '#d97706' }
    ];

    let unscheduledJobs = JSON.parse(localStorage.getItem('crew_schedule_unscheduled_v3')) || [
      { id: 'sold-1', client: 'Robertson', scope: '20x16 Timber Pavilion', address: '116th & Olio Rd, Fishers, IN', duration: '4 Days', materialStatus: 'Staged at Yard' },
      { id: 'sold-2', client: 'Miller', scope: 'Louvered Pergola & Deck', address: 'Brooks School Rd, Fishers, IN', duration: '3 Days', materialStatus: 'Ready to Build' }
    ];

    let events = JSON.parse(localStorage.getItem('crew_schedule_events_v3')) || [
      { id: 'ev-1', crewId: 'crew-1', date: formatDate(new Date()), title: 'Framing & Decking', client: 'Robertson', address: '116th & Olio Rd, Fishers, IN', scope: 'Deck', status: 'In Progress' }
    ];

    function formatDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 5-Day Weather Forecast Engine for Fishers, IN
    const forecastDays = [
      { day: 'Mon', high: 71, low: 48, cond: 'Sunny', rain: '0%', icon: '☀️' },
      { day: 'Tue', high: 74, low: 52, cond: 'Partly Cloudy', rain: '10%', icon: '⛅' },
      { day: 'Wed', high: 69, low: 50, cond: 'Scattered Showers', rain: '45%', icon: '🌦️' },
      { day: 'Thu', high: 65, low: 46, cond: 'Rain / Wind', rain: '70%', icon: '🌧️' },
      { day: 'Fri', high: 68, low: 47, cond: 'Clear / Breeze', rain: '5%', icon: '🌤️' }
    ];

    function renderForecastStrip() {
      const container = document.getElementById('forecastDaysContainer');
      if (!container) return;
      container.innerHTML = forecastDays.map(f => `
        <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-lg bg-slate-900 border border-slate-800 shrink-0">
          <span class="text-xs">${f.icon}</span>
          <span class="font-bold text-white">${f.day}</span>
          <span class="text-amber-400 font-bold">${f.high}°</span>
          <span class="text-slate-500">${f.low}°</span>
          <span class="text-[10px] text-sky-400 font-semibold">${f.rain}</span>
        </div>
      `).join('');
    }

    function renderCrewsSidebar() {
      const container = document.getElementById('crewsListContainer');
      const modalSelect = document.getElementById('jobModalCrewSelect');
      if (!container) return;
      container.innerHTML = '';
      if (modalSelect) modalSelect.innerHTML = '';

      crews.forEach(c => {
        if (modalSelect) {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.name} (${c.trade})`;
          modalSelect.appendChild(opt);
        }

        const card = document.createElement('div');
        card.className = "crew-card bg-slate-950/80 border border-brand-border hover:border-slate-600 rounded-xl p-2 sm:p-2.5 cursor-grab active:cursor-grabbing transition shadow-sm relative group";
        card.setAttribute('draggable', 'true');
        card.dataset.crewId = c.id;
        card.dataset.dragType = 'crew';

        card.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'crew', crewId: c.id })));
        card.addEventListener('touchstart', handleTouchStart, { passive: false });
        card.addEventListener('touchmove', handleTouchMove, { passive: false });
        card.addEventListener('touchend', handleTouchEnd, { passive: false });

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full shrink-0" style="background-color: ${c.color}"></span>
              <div>
                <h4 class="text-xs sm:text-sm font-bold text-white leading-tight">${c.name}</h4>
                <p class="text-[10px] text-amber-300 font-medium truncate max-w-[140px] sm:max-w-none">${c.trade}</p>
              </div>
            </div>
            <span class="text-[9px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-mono">${c.size}p</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderUnscheduledQueue() {
      const container = document.getElementById('unscheduledListContainer');
      if (!container) return;
      container.innerHTML = '';

      unscheduledJobs.forEach(job => {
        const item = document.createElement('div');
        item.className = "bg-slate-950/80 border border-brand-border rounded-xl p-2 cursor-grab active:cursor-grabbing transition text-xs space-y-1";
        item.setAttribute('draggable', 'true');
        item.dataset.soldId = job.id;
        item.dataset.dragType = 'sold';

        item.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'sold', soldId: job.id })));
        item.addEventListener('touchstart', handleTouchStart, { passive: false });
        item.addEventListener('touchmove', handleTouchMove, { passive: false });
        item.addEventListener('touchend', handleTouchEnd, { passive: false });

        item.innerHTML = `
          <div class="flex items-center justify-between font-bold text-white text-[11px]">
            <span>${job.client}</span>
            <span class="text-[9px] text-amber-400">${job.materialStatus}</span>
          </div>
          <p class="text-[10px] text-slate-300 truncate">${job.scope}</p>
        `;
        container.appendChild(item);
      });
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const label = document.getElementById('currentPeriodLabel');
      if (!grid) return;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      label.textContent = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric' }).format(currentDate);

      grid.innerHTML = '';
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

      for (let i = 0; i < totalCells; i++) {
        const dayNumber = i - firstDay + 1;
        const cell = document.createElement('div');
        cell.className = "cal-cell bg-slate-900/90 border border-brand-border/40 p-1 min-h-[60px] sm:min-h-[85px] flex flex-col justify-between overflow-hidden";

        if (dayNumber > 0 && dayNumber <= daysInMonth) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNumber).padStart(2, '0')}`;
          cell.dataset.date = dateStr;
          const isToday = dateStr === formatDate(new Date());

          cell.innerHTML = `
            <div class="flex items-center justify-between pb-0.5">
              <span class="text-[10px] sm:text-xs font-bold ${isToday ? 'w-4 h-4 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-black' : 'text-slate-400'}">${dayNumber}</span>
              <button onclick="openNewJobOnDate('${dateStr}')" class="text-[10px] text-slate-500 hover:text-white px-0.5">+</button>
            </div>
            <div class="cal-events space-y-0.5 overflow-y-auto flex-1 custom-scrollbar"></div>
          `;

          const evWrapper = cell.querySelector('.cal-events');
          const dayEvents = events.filter(e => e.date === dateStr);
          dayEvents.forEach(ev => {
            const crew = crews.find(c => c.id === ev.crewId) || { name: 'Crew', color: '#f59e0b' };
            const pill = document.createElement('div');
            pill.className = "px-1.5 py-0.5 rounded text-[9px] sm:text-[10px] text-white flex items-center justify-between truncate shadow-sm cursor-pointer hover:brightness-110";
            pill.style.backgroundColor = crew.color + 'ee';
            pill.onclick = () => openEditJobModal(ev.id);
            pill.innerHTML = `<span class="truncate"><b>${crew.name}:</b> ${ev.client || ev.title}</span>`;
            evWrapper.appendChild(pill);
          });

          cell.addEventListener('dragover', (e) => { e.preventDefault(); cell.classList.add('drag-over-cell'); });
          cell.addEventListener('dragleave', () => cell.classList.remove('drag-over-cell'));
          cell.addEventListener('drop', (e) => {
            e.preventDefault();
            cell.classList.remove('drag-over-cell');
            const dataStr = e.dataTransfer.getData('text/plain');
            if (dataStr) handleDropOnDate(JSON.parse(dataStr), dateStr);
          });
        } else {
          cell.classList.add('opacity-25', 'bg-slate-950/60');
        }
        grid.appendChild(cell);
      }
    }

    function handleDropOnDate(data, dateStr) {
      if (data.type === 'crew') {
        const crew = crews.find(c => c.id === data.crewId);
        events.push({
          id: 'ev-' + Date.now(),
          crewId: data.crewId,
          date: dateStr,
          title: crew.trade || 'Work Assignment',
          client: 'Client Project',
          address: 'Fishers, IN',
          scope: 'Deck',
          status: 'Scheduled'
        });
      } else if (data.type === 'sold') {
        const idx = unscheduledJobs.findIndex(j => j.id === data.soldId);
        if (idx !== -1) {
          const s = unscheduledJobs[idx];
          events.push({
            id: 'ev-' + Date.now(),
            crewId: crews[0].id,
            date: dateStr,
            title: s.scope,
            client: s.client,
            address: s.address,
            scope: 'Deck',
            status: 'Scheduled'
          });
          unscheduledJobs.splice(idx, 1);
        }
      }
      pushDataToCloud();
      renderCalendar();
      renderUnscheduledQueue();
    }

    // Touch Ghost Logic for Mobile & TV Wall
    let touchDragData = null;
    const ghost = document.getElementById('touchGhost');

    function handleTouchStart(e) {
      const card = e.currentTarget;
      touchDragData = card.dataset.dragType === 'crew' ? { type: 'crew', crewId: card.dataset.crewId } : { type: 'sold', soldId: card.dataset.soldId };
      document.getElementById('ghostTitle').innerText = touchDragData.type === 'crew' ? "Assign Crew" : "Schedule Job";
      ghost.style.opacity = '1';
      const t = e.touches[0];
      ghost.style.left = t.clientX + 'px';
      ghost.style.top = t.clientY + 'px';
    }

    function handleTouchMove(e) {
      if (!touchDragData) return;
      e.preventDefault();
      const t = e.touches[0];
      ghost.style.left = t.clientX + 'px';
      ghost.style.top = t.clientY + 'px';
    }

    function handleTouchEnd(e) {
      if (!touchDragData) return;
      ghost.style.opacity = '0';
      const t = e.changedTouches[0];
      const target = document.elementFromPoint(t.clientX, t.clientY);
      const cell = target ? target.closest('[data-date]') : null;
      if (cell && cell.dataset.date) handleDropOnDate(touchDragData, cell.dataset.date);
      touchDragData = null;
    }

    // TV Wall Mode Switcher
    function toggleWallFullscreen() {
      document.body.classList.toggle('wall-mode');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
      setTimeout(() => {
        renderCalendar();
        renderCrewsSidebar();
      }, 100);
    }

    function setSidebarTab(tab) {
      const btnCrews = document.getElementById('tabBtnCrews');
      const btnUnscheduled = document.getElementById('tabBtnUnscheduled');
      const panelCrews = document.getElementById('panelCrews');
      const panelUnscheduled = document.getElementById('panelUnscheduled');

      if (tab === 'crews') {
        btnCrews.className = "flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition";
        btnUnscheduled.className = "flex-1 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 transition";
        panelCrews.classList.remove('hidden');
        panelUnscheduled.classList.add('hidden');
      } else {
        btnUnscheduled.className = "flex-1 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition";
        btnCrews.className = "flex-1 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 transition";
        panelUnscheduled.classList.remove('hidden');
        panelCrews.classList.add('hidden');
      }
    }

    function openNewJobOnDate(dateStr) {
      document.getElementById('jobModalId').value = '';
      document.getElementById('jobModalDateInput').value = dateStr;
      document.getElementById('jobModalTitleInput').value = '';
      document.getElementById('jobModalAddressInput').value = '';
      document.getElementById('btnDeleteJob').classList.add('hidden');
      document.getElementById('modalJobTitle').innerText = "Schedule Job Assignment";
      document.getElementById('modalJobDetails').classList.remove('hidden');
    }

    function openEditJobModal(evId) {
      const ev = events.find(e => e.id === evId);
      if (!ev) return;
      document.getElementById('jobModalId').value = ev.id;
      document.getElementById('jobModalDateInput').value = ev.date;
      document.getElementById('jobModalCrewSelect').value = ev.crewId;
      document.getElementById('jobModalTitleInput').value = ev.client || ev.title;
      document.getElementById('jobModalAddressInput').value = ev.address || '';
      document.getElementById('jobModalScopeSelect').value = ev.scope || 'Deck';
      document.getElementById('jobModalStatusSelect').value = ev.status || 'Scheduled';
      document.getElementById('btnDeleteJob').classList.remove('hidden');
      document.getElementById('modalJobTitle').innerText = "Edit Job Assignment";
      document.getElementById('modalJobDetails').classList.remove('hidden');
    }

    function saveJobAssignment() {
      const id = document.getElementById('jobModalId').value;
      const date = document.getElementById('jobModalDateInput').value;
      const crewId = document.getElementById('jobModalCrewSelect').value;
      const client = document.getElementById('jobModalTitleInput').value;
      const address = document.getElementById('jobModalAddressInput').value;
      const scope = document.getElementById('jobModalScopeSelect').value;
      const status = document.getElementById('jobModalStatusSelect').value;

      if (id) {
        const ev = events.find(e => e.id === id);
        if (ev) { Object.assign(ev, { date, crewId, client, address, scope, status }); }
      } else {
        events.push({ id: 'ev-' + Date.now(), crewId, date, title: scope, client, address, scope, status });
      }
      pushDataToCloud();
      renderCalendar();
      closeModal('modalJobDetails');
    }

    function deleteCurrentJob() {
      const id = document.getElementById('jobModalId').value;
      events = events.filter(e => e.id !== id);
      pushDataToCloud();
      renderCalendar();
      closeModal('modalJobDetails');
    }

    function openAddSoldJobModal() {
      document.getElementById('soldClientName').value = '';
      document.getElementById('soldScope').value = '';
      document.getElementById('soldAddress').value = '';
      document.getElementById('modalAddSoldJob').classList.remove('hidden');
    }

    function saveSoldJobToBacklog() {
      const client = document.getElementById('soldClientName').value;
      const scope = document.getElementById('soldScope').value;
      const address = document.getElementById('soldAddress').value;
      if (!client) return;

      unscheduledJobs.push({ id: 'sold-' + Date.now(), client, scope, address, duration: '3 Days', materialStatus: 'Staged at Yard' });
      pushDataToCloud();
      renderUnscheduledQueue();
      closeModal('modalAddSoldJob');
    }

    function openCurrentModalAddressInGoogleMaps() {
      const addr = document.getElementById('jobModalAddressInput').value;
      if (addr) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`, '_blank');
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function navigatePeriod(step) { currentDate.setMonth(currentDate.getMonth() + step); renderCalendar(); }
    function goToToday() { currentDate = new Date(); renderCalendar(); }
    function setView(view) {
      currentView = view;
      document.getElementById('btnViewMonth').className = view === 'month' ? "px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950" : "px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800";
      document.getElementById('btnViewWeek').className = view === 'week' ? "px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950" : "px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800";
      renderCalendar();
    }

    // Weather Canvas & Doppler Sweep
    const sky = document.getElementById('weatherSkyCanvas');
    const sCtx = sky.getContext('2d');
    function animSky() {
      sky.width = sky.offsetWidth; sky.height = sky.offsetHeight;
      sCtx.clearRect(0,0,sky.width,sky.height);
      sCtx.fillStyle = "rgba(255,255,255,0.12)";
      sCtx.beginPath();
      sCtx.arc(sky.width*0.4, sky.height*0.5, 12, 0, Math.PI*2);
      sCtx.arc(sky.width*0.48, sky.height*0.4, 16, 0, Math.PI*2);
      sCtx.arc(sky.width*0.56, sky.height*0.5, 12, 0, Math.PI*2);
      sCtx.fill();
      requestAnimationFrame(animSky);
    }
    requestAnimationFrame(animSky);

    function openRadarModal() {
      document.getElementById('modalRadar').classList.remove('hidden');
      initDoppler();
    }

    let rAng = 0;
    function initDoppler() {
      const rCan = document.getElementById('dopplerRadarCanvas');
      const rCtx = rCan.getContext('2d');
      rCan.width = rCan.offsetWidth; rCan.height = rCan.offsetHeight;
      function sweep() {
        if (document.getElementById('modalRadar').classList.contains('hidden')) return;
        rCtx.fillStyle = '#0a0f1d'; rCtx.fillRect(0,0,rCan.width,rCan.height);
        const cx = rCan.width/2, cy = rCan.height/2, maxR = Math.min(cx, cy)-15;
        rCtx.strokeStyle = '#1e293b';
        for(let r=40; r<=maxR; r+=40) { rCtx.beginPath(); rCtx.arc(cx,cy,r,0,Math.PI*2); rCtx.stroke(); }
        rCtx.beginPath(); rCtx.moveTo(cx-maxR, cy); rCtx.lineTo(cx+maxR, cy); rCtx.moveTo(cx, cy-maxR); rCtx.lineTo(cx, cy+maxR); rCtx.stroke();
        
        // Precipitation blob
        rCtx.fillStyle = 'rgba(16, 185, 129, 0.28)';
        rCtx.beginPath(); rCtx.arc(cx+45, cy-35, 30, 0, Math.PI*2); rCtx.fill();
        
        rAng += 0.035;
        rCtx.save(); rCtx.translate(cx, cy); rCtx.rotate(rAng);
        const grad = rCtx.createLinearGradient(0,0,maxR,0);
        grad.addColorStop(0, 'rgba(245,158,11,0)'); grad.addColorStop(1, 'rgba(245,158,11,0.65)');
        rCtx.fillStyle = grad; rCtx.beginPath(); rCtx.moveTo(0,0); rCtx.arc(0,0,maxR,0,0.3); rCtx.fill();
        rCtx.restore();
        
        rCtx.fillStyle = '#f59e0b'; rCtx.beginPath(); rCtx.arc(cx, cy, 3, 0, Math.PI*2); rCtx.fill();
        requestAnimationFrame(sweep);
      }
      requestAnimationFrame(sweep);
    }

    // Initialize UI
    renderCrewsSidebar();
    renderUnscheduledQueue();
    renderCalendar();
    renderForecastStrip();
  </script>
</body>
